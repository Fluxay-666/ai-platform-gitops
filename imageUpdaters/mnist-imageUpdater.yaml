apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: mnist-service-updater
  namespace: ml
spec:
  namespace: ml
  applicationRefs:
    - namePattern: "mnist-*"
      images:
        - alias: "mnist"
          imageName: "registry.192.168.31.202.nip.io/devops/pytorch-k8s-training"
          manifestTargets:
            helm:
              name: "image.repository"
              tag: "image.tag"
          commonUpdateSettings:
            updateStrategy: "newest-build"
            pullSecret: "pullsecret:ml/gitlab-registry"
